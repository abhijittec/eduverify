/* ============================================================ API ============================================================ */
const API = {
  token: null,
  async req(method, path, body, isForm) {
    const headers = {};
    if (API.token) headers["Authorization"] = "Bearer " + API.token;
    let payload;
    if (isForm) payload = body;
    else if (body !== undefined) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
    const res = await fetch(path, { method, headers, body: payload });
    let data = {}; try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
    return data;
  },
  get(p) { return API.req("GET", p); },
  post(p, b) { return API.req("POST", p, b); },
  patch(p, b) { return API.req("PATCH", p, b); },
  del(p) { return API.req("DELETE", p); },
  upload(p, file) { const fd = new FormData(); fd.append("file", file); return API.req("POST", p, fd, true); },
  async blob(path) {
    const headers = {};
    if (API.token) headers["Authorization"] = "Bearer " + API.token;
    const res = await fetch(path, { headers });
    if (!res.ok) { let d = {}; try { d = await res.json(); } catch (e) {} throw new Error(d.error || ("Download failed (" + res.status + ")")); }
    return res.blob();
  },
};

const AUTH_KEY = "ev_auth";
function loadAuth() { try { const a = JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); if (a && a.token) { API.token = a.token; return a; } } catch (e) {} return null; }
function saveAuth(a) { if (a) { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); API.token = a.token; } else { localStorage.removeItem(AUTH_KEY); API.token = null; } }

const downloadBlob = (filename, blob) => { const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };

/* ============================================================ ROOT ============================================================ */
function App() {
  const [auth, setAuth] = useState(loadAuth);
  const onAuth = (a) => { saveAuth(a); setAuth(a); };
  const logout = () => { saveAuth(null); setAuth(null); };
  if (!auth) return <AuthScreen onAuth={onAuth} />;
  if (auth.role === "admin") return <AdminApp auth={auth} logout={logout} />;
  return <StudentApp auth={auth} logout={logout} />;
}

function StudentLogin({ onAuth, back }) {
  const [step, setStep] = useState("identify");
  const [appNo, setAppNo] = useState(""); const [dob, setDob] = useState(""); const [name, setName] = useState("");
  const [pwd, setPwd] = useState(""); const [pwd2, setPwd2] = useState("");
  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const check = async (e) => { e.preventDefault(); setErr(""); setBusy(true); try { const r = await API.post("/api/auth/student/check", { appNo, dob }); setName(r.name); setStep(r.firstLogin ? "setPwd" : "login"); } catch (ex) { setErr(ex.message); } setBusy(false); };
  const register = async (e) => { e.preventDefault(); setErr(""); if (pwd.length < 6) { setErr("Password must be at least 6 characters."); return; } if (pwd !== pwd2) { setErr("The two passwords do not match."); return; } setBusy(true); try { const r = await API.post("/api/auth/student/register", { appNo, dob, password: pwd }); onAuth({ token:r.token, role:"student", name:r.student.name, appNo:r.student.appNo }); } catch (ex) { setErr(ex.message); } setBusy(false); };
  const login = async (e) => { e.preventDefault(); setErr(""); setBusy(true); try { const r = await API.post("/api/auth/student/login", { appNo, password: pwd }); onAuth({ token:r.token, role:"student", name:r.student.name, appNo:r.student.appNo }); } catch (ex) { setErr(ex.message); } setBusy(false); };
  const reset = async (e) => { e.preventDefault(); setErr(""); if (pwd.length < 6) { setErr("New password must be at least 6 characters."); return; } if (pwd !== pwd2) { setErr("The two passwords do not match."); return; } setBusy(true); try { const r = await API.post("/api/auth/student/reset-password", { appNo, dob, password: pwd }); onAuth({ token:r.token, role:"student", name:r.student.name, appNo:r.student.appNo }); } catch (ex) { setErr(ex.message); } setBusy(false); };
  return (<div className="max-w-md mx-auto px-6 py-12 fade-in">
    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 className="text-2xl font-bold text-slate-800">Student Login</h2>
      <p className="text-sm text-slate-500 mt-1">{step==="identify" && "Enter your application number and date of birth."}{step==="setPwd" && `Welcome, ${name}. Set a password for your account.`}{step==="login" && `Welcome back, ${name}. Enter your password.`}{step==="forgot" && `Reset the password for ${appNo}.`}</p>
      {step==="identify" && (<form onSubmit={check} className="mt-5 space-y-4"><Field label="Application Number"><input value={appNo} onChange={e=>setAppNo(e.target.value)} placeholder="e.g. CSE2026001" required className="ev-input" /></Field><Field label="Date of Birth"><input type="date" value={dob} onChange={e=>setDob(e.target.value)} required className="ev-input" /></Field><ErrorNote msg={err} /><PrimaryBtn busy={busy}>Continue →</PrimaryBtn></form>)}
      {step==="setPwd" && (<form onSubmit={register} className="mt-5 space-y-4"><Field label="Create Password (min 6 characters)"><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} required className="ev-input" /></Field><Field label="Confirm Password"><input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} required className="ev-input" /></Field><ErrorNote msg={err} /><PrimaryBtn busy={busy}>Create account & continue →</PrimaryBtn></form>)}
      {step==="login" && (<form onSubmit={login} className="mt-5 space-y-4"><Field label="Password"><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} required className="ev-input" autoFocus /></Field><ErrorNote msg={err} /><PrimaryBtn busy={busy}>Sign in →</PrimaryBtn><div className="flex justify-between text-sm"><button type="button" onClick={()=>{setStep("forgot");setErr("");setPwd("");setPwd2("");}} className="text-indigo-600 hover:underline">Forgot password?</button><button type="button" onClick={()=>{setStep("identify");setErr("");setPwd("");}} className="text-slate-500 hover:text-slate-800">Different application no.</button></div></form>)}
      {step==="forgot" && (<form onSubmit={reset} className="mt-5 space-y-4"><div className="text-xs text-slate-600 bg-blue-50 border border-blue-200 rounded-md p-2">Your identity is confirmed by your application number and date of birth.</div><Field label="New Password (min 6 characters)"><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} required className="ev-input" autoFocus /></Field><Field label="Confirm New Password"><input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} required className="ev-input" /></Field><ErrorNote msg={err} /><PrimaryBtn busy={busy}>Reset password & sign in →</PrimaryBtn><button type="button" onClick={()=>{setStep("login");setErr("");setPwd("");setPwd2("");}} className="w-full text-slate-500 text-sm hover:text-slate-800">← Back to login</button></form>)}
      {step==="identify" && <button type="button" onClick={back} className="w-full text-slate-400 text-sm hover:text-slate-700 mt-4">← Back</button>}
    </div>
    <p className="text-center text-xs text-slate-400 mt-4">Trouble logging in? Call {SUPPORT.phone}</p>
  </div>);
}

  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const submit = async (e) => { e.preventDefault(); setErr(""); setBusy(true); try { const r = await API.post("/api/auth/admin/login", { staffId, password: pwd }); onAuth({ token:r.token, role:"admin", name:r.admin.name, staffId:r.admin.staffId, adminRole:r.admin.role }); } catch (ex) { setErr(ex.message); } setBusy(false); };
  return (<div className="max-w-md mx-auto px-6 py-12 fade-in"><div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6"><h2 className="text-2xl font-bold text-slate-800">Verification Cell Login</h2><p className="text-sm text-slate-500 mt-1">For admission verification staff only.</p><form onSubmit={submit} className="mt-5 space-y-4"><Field label="Staff ID"><input value={staffId} onChange={e=>setStaffId(e.target.value)} placeholder="e.g. ADM-001" required className="ev-input" /></Field><Field label="Password"><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} required className="ev-input" /></Field><ErrorNote msg={err} /><button className="w-full bg-slate-800 text-white font-semibold py-2.5 rounded-lg hover:bg-slate-900 disabled:opacity-60" disabled={busy}>{busy?"Signing in…":"Sign in →"}</button><button type="button" onClick={back} className="w-full text-slate-400 text-sm hover:text-slate-700">← Back</button></form></div></div>);
}

/* ============================================================ STUDENT APP ============================================================ */
function StudentApp({ auth, logout }) {
  const [screen, setScreen] = useState("dashboard");
  const [data, setData] = useState(null); const [err, setErr] = useState(""); const [loading, setLoading] = useState(true);
  const [showTemplates, setShowTemplates] = useState(false);
  const reload = useCallback(async () => { try { const d = await API.get("/api/student/me"); setData(d); setErr(""); } catch (ex) { setErr(ex.message); if (/log in/i.test(ex.message)) logout(); } setLoading(false); }, [logout]);
  useEffect(() => { reload(); }, [reload]);
  const right = (<><div className="hidden sm:flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg"><span className="w-2 h-2 rounded-full bg-green-500"></span><span className="text-slate-700">{auth.name}</span><span className="text-slate-400">·</span><span className="text-slate-500">{auth.appNo}</span></div><button onClick={()=>setShowTemplates(true)} className="text-indigo-600 hover:underline text-sm">📄 Templates</button><button onClick={logout} className="text-slate-500 hover:text-slate-800">Logout</button></>);
  let body;
  if (loading) body = <Spinner label="Loading your portal…" />;
  else if (!data) body = <div className="max-w-md mx-auto py-16 text-center"><ErrorNote msg={err || "Could not load your data."} /><button onClick={reload} className="mt-3 text-indigo-600 text-sm">Retry</button></div>;
  else if (screen==="dashboard") body = <SDashboard data={data} go={setScreen} openTemplates={()=>setShowTemplates(true)} />;
  else if (screen==="checklist") body = <SChecklist data={data} reload={reload} go={setScreen} openTemplates={()=>setShowTemplates(true)} />;
  else if (screen==="declare")   body = <SDeclaration data={data} reload={reload} go={setScreen} />;
  else if (screen==="slot")      body = <SSlot data={data} reload={reload} go={setScreen} />;
  else if (screen==="summary")   body = <SSummary data={data} go={setScreen} />;
  else if (screen==="faq")       body = <SFaq go={setScreen} />;
  return (<div className="min-h-screen flex flex-col"><TopBar subtitle="Student Portal" right={right} /><main className="flex-1">{body}</main><Footer />{showTemplates && <TemplatesModal close={()=>setShowTemplates(false)} />}</div>);
}

function docStats(documents) {
  const total = documents.length;
  const ready = documents.filter(d=>d.studentStatus==="ready").length;
  const issue = documents.filter(d=>d.studentStatus==="issue").length;
  const pending = documents.filter(d=>d.studentStatus==="pending").length;
  const flagged = documents.filter(d=>d.flagged).length;
  return { total, ready, issue, pending, flagged, allReady: total>0 && ready===total };
}

function StageNav({ steps }) {
  return (<div className="flex items-center gap-2 flex-wrap text-sm">{steps.map((s, i) => (<React.Fragment key={i}>{i > 0 && <span className="text-slate-300">›</span>}{s.onClick ? <button onClick={s.onClick} className={`hover:underline ${s.active?'text-indigo-700 font-semibold':'text-slate-600'}`}>{s.label}</button> : <span className={s.active?'text-indigo-700 font-semibold':'text-slate-500'}>{s.label}</span>}</React.Fragment>))}</div>);
}

function SDashboard({ data, go, openTemplates }) {
  const { student, documents, slot } = data;
  const st = docStats(documents);
  const pct = Math.round((st.ready/Math.max(st.total,1))*100);
  const pending = student.pendingDocs || student.submissionDeadline;
  const slotRej = student.slotRejected;
  return (<div className="max-w-7xl mx-auto px-6 py-8 fade-in">
    <h2 className="text-2xl font-bold text-slate-800">Welcome, {student.name.split(" ")[0]}</h2>
    <p className="text-sm text-slate-500">Here is your admission and verification progress.</p>
    {pending && (<div className="bg-amber-50 border border-amber-300 rounded-2xl p-4 mt-5 fade-in"><div className="font-semibold text-amber-900">⚠ Pending items recorded by the verification cell</div>{student.pendingDocs && <div className="mt-1 text-sm text-amber-800 whitespace-pre-line">{student.pendingDocs}</div>}{student.submissionDeadline && <div className="mt-1 text-xs text-amber-700">Please submit by <b>{fmtDate(student.submissionDeadline)}</b>.</div>}</div>)}
    {slotRej && (<div className="bg-rose-50 border border-rose-300 rounded-2xl p-4 mt-5 fade-in"><div className="font-semibold text-rose-900">⚠ Reporting slot rejected by the verification cell</div>{student.slotRejectReason && <div className="mt-1 text-sm text-rose-800">{student.slotRejectReason}</div>}<button onClick={()=>go("slot")} className="mt-2 text-sm bg-rose-600 text-white px-3 py-1.5 rounded-md hover:bg-rose-700">Pick a new slot →</button></div>)}
    <div className="grid md:grid-cols-3 gap-5 mt-6">
      <div className="md:col-span-2 bg-white p-5 rounded-2xl border border-slate-200">
        <div className="flex items-start justify-between"><div><div className="text-xs text-slate-500">Admission Status</div><div className="mt-1 inline-flex items-center gap-2 bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1 rounded-full text-sm font-medium"><span className="w-2 h-2 rounded-full bg-amber-500 blink"></span> Provisionally Admitted</div></div><div className="text-right"><div className="text-xs text-slate-500">Application No.</div><div className="font-mono text-slate-700 text-sm">{student.appNo}</div></div></div>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-5 text-sm"><Info label="Program" value={student.program} /><Info label="Category" value={student.category} /><Info label="Section" value={student.section} /><Info label="Orientation" value={fmtDate(student.orientationDate)} /></div>
      </div>
      <div className="bg-white p-5 rounded-2xl border border-slate-200">
        <div className="text-xs text-slate-500">Document Readiness</div>
        <div className="mt-1 text-3xl font-bold text-slate-800">{pct}%</div>
        <div className="w-full bg-slate-100 rounded-full h-2 mt-2 overflow-hidden"><div className={`h-2 ${pct===100?'bg-green-500':pct>0?'bg-yellow-400':'bg-slate-300'}`} style={{width:`${pct}%`}}></div></div>
        <div className="mt-3 flex items-center text-xs gap-3 flex-wrap"><span><span className={`traffic-light ${lightColor("ready")}`}></span>{st.ready} ready</span><span><span className={`traffic-light ${lightColor("pending")}`}></span>{st.pending} pending</span><span><span className={`traffic-light ${lightColor("issue")}`}></span>{st.issue} issue</span>{st.flagged>0 && <span className="text-rose-700">⚑ {st.flagged} flagged</span>}</div>
      </div>
    </div>
    <div className="bg-white border border-slate-200 rounded-2xl p-5 mt-5">
      <div className="grid sm:grid-cols-4 gap-4">
        <StepCard n="1" t="Document Checklist" d={`${st.ready}/${st.total} ready`} done={st.allReady} cta="Open Checklist" onClick={()=>go("checklist")} />
        <StepCard n="2" t="Self-Declaration" d={student.declared?"Signed":"Pending"} done={student.declared} cta="Sign Declaration" onClick={()=>go("declare")} disabled={!st.allReady} hint="Finish all documents first" />
        <StepCard n="3" t="Book Reporting Slot" d={slot && !slotRej?`${fmtDate(slot.date)} · ${slot.time}`:slotRej?"Slot rejected — pick another":"Not booked"} done={!!slot && !slotRej} cta={slot && !slotRej?"View My Slot":"Pick a Slot"} onClick={()=>go("slot")} disabled={!st.allReady||!student.declared} hint="Sign declaration first" />
        <StepCard n="4" t="Original Document Verification" d={slot && !slotRej?(student.slotConfirmed?"Documents Submitted for Physical Verification":"Awaiting staff check"):"After booking"} done={!!slot && !slotRej && student.slotConfirmed} cta="View Verification" onClick={()=>go("summary")} disabled={!slot || slotRej} hint="Book a slot first" />
      </div>
    </div>
    <div className="mt-5 grid md:grid-cols-3 gap-5">
      <div className="md:col-span-2 bg-amber-50 border border-amber-200 rounded-2xl p-5 text-sm text-amber-800"><div className="font-semibold text-amber-900">Tip — finish in one sitting (~15 mins)</div>Keep your documents ready as PDFs or JPGs under 6 MB. For marks cards and certificates also enter the issuing board / university so we can pre-verify it.<div className="mt-2 flex flex-wrap gap-2"><button onClick={openTemplates} className="text-amber-900 underline">📄 Download Standard Templates</button><span className="text-amber-700">·</span><button onClick={()=>go("faq")} className="text-amber-900 underline">Read the FAQ</button></div></div>
      <SupportCard />
    </div>
  </div>);
}
function Info({ label, value }) { return <div><div className="text-xs text-slate-500">{label}</div><div className="font-medium text-slate-800">{value || "—"}</div></div>; }
function StepCard({ n, t, d, done, cta, onClick, disabled, hint }) {
  return (<div className={`rounded-xl border p-4 ${done?'bg-green-50 border-green-200':'bg-slate-50 border-slate-200'}`}><div className="flex items-center gap-2"><div className={`w-7 h-7 grid place-content-center rounded-full text-xs font-bold ${done?'bg-green-500 text-white':'bg-slate-300 text-slate-700'}`}>{done?'✓':n}</div><div className="font-semibold text-slate-800 text-sm">{t}</div></div><div className="text-xs text-slate-600 mt-2">{d}</div><button disabled={disabled} onClick={onClick} className={`mt-3 w-full text-sm font-medium px-3 py-2 rounded-lg ${disabled?'bg-slate-200 text-slate-400 cursor-not-allowed':'bg-indigo-600 text-white hover:bg-indigo-700'}`}>{cta}</button>{disabled && hint && <div className="text-[10px] text-slate-500 mt-1">{hint}</div>}</div>);
}
function SupportCard() {
  return (<div className="bg-white border border-slate-200 rounded-2xl p-5"><div className="font-semibold text-slate-800">Need help?</div><div className="text-xs text-slate-500">Admission Support Cell</div><ul className="text-sm mt-3 space-y-1.5 text-slate-700"><li>Phone: {SUPPORT.phone}</li><li>Email: {SUPPORT.email}</li><li>WhatsApp: {SUPPORT.whatsapp}</li><li>Hours: {SUPPORT.hours}</li></ul></div>);
}

function SChecklist({ data, reload, go, openTemplates }) {
  const { documents, student } = data;
  const [openCode, setOpenCode] = useState(null);
  const st = docStats(documents);
  const openDoc = documents.find(d=>d.docCode===openCode);
  return (<div className="max-w-7xl mx-auto px-6 py-8 fade-in">
    <StageNav steps={[{label:"Dashboard",onClick:()=>go("dashboard")},{label:"Document Checklist",active:true},{label:"Self-Declaration",onClick:st.allReady?()=>go("declare"):null}]} />
    <div className="flex items-end justify-between flex-wrap gap-3 mt-3"><div><h2 className="text-2xl font-bold text-slate-800">Your Document Checklist</h2><p className="text-sm text-slate-500">Profile: <b>{student.profile.replace(/-/g,' · ')}</b> · {st.total} mandatory documents · {st.ready} ready{st.flagged>0 && <span className="text-rose-700"> · ⚑ {st.flagged} flagged</span>}</p><p className="text-[11px] text-slate-500 mt-1"><MandStar/> All listed documents are mandatory.</p></div><button onClick={openTemplates} className="text-sm bg-white border border-indigo-300 text-indigo-700 px-3 py-2 rounded-lg hover:bg-indigo-50">📄 Standard Templates</button></div>
    <div className="mt-5 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{documents.map(d => (
      <button key={d.docCode} onClick={()=>setOpenCode(d.docCode)} className={`text-left bg-white border rounded-2xl p-4 hover:shadow-md transition ${d.flagged?'border-rose-300 hover:border-rose-400':'border-slate-200 hover:border-indigo-300'}`}>
        <div className="flex items-start justify-between gap-2"><div className="font-semibold text-slate-800 text-sm">{d.name}<MandStar/></div><span className={`text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full ${d.original?'bg-rose-50 text-rose-700':'bg-emerald-50 text-emerald-700'}`}>{d.original?'Original':'Photocopy'}</span></div>
        <div className="text-xs text-slate-500 mt-1">{catalog(d.docCode).formats}</div>
        <div className="mt-3 flex items-center justify-between"><span className="text-xs flex items-center"><span className={`traffic-light ${lightColor(d.studentStatus)}`}></span>{lightLabel(d.studentStatus)}</span>{d.hasFile && <span className="text-[11px] text-slate-500 truncate max-w-[110px]">{d.fileName}</span>}</div>
        {d.flagged && <div className="mt-1 text-[11px] text-rose-700">⚑ Flagged — institution under review</div>}
        {d.staffStatus==="rejected" && <div className="mt-1 text-[11px] text-rose-600">Rejected — open to re-upload</div>}
        {d.staffStatus==="verified" && <div className="mt-1 text-[11px] text-green-600">Verified by staff ✓{d.verifiedByStaffId?` (${d.verifiedByStaffId})`:""}</div>}
      </button>
    ))}</div>
    <div className="mt-6 flex justify-end"><button disabled={!st.allReady || student.declared} onClick={()=>go("declare")} className={`px-4 py-2 rounded-lg font-semibold ${(!st.allReady||student.declared)?'bg-slate-200 text-slate-400 cursor-not-allowed':'bg-indigo-600 text-white hover:bg-indigo-700'}`}>Continue to Self-Declaration →</button></div>
    {openDoc && <DocModal doc={openDoc} reload={reload} close={()=>setOpenCode(null)} openTemplates={openTemplates} />}
  </div>);
}

function DocModal({ doc, reload, close, openTemplates }) {
  const code = doc.docCode;
  const cat = catalog(code);
  const [tab, setTab] = useState(doc.hasFile ? "verify" : "upload");
  const [verify, setVerify] = useState(doc.selfVerify || {});
  const [institution, setInstitution] = useState(doc.institutionName || "");
  const [issue, setIssue] = useState(doc.issueNote || "");
  const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const [preview, setPreview] = useState(false);
  const allVerified = VERIFY_QUESTIONS.every(q => verify[q.key]);
  const needsInst = doc.needsInstitution;
  const isReady = doc.studentStatus === "ready";
  const isVerified = doc.staffStatus === "verified";
  const isRejected = doc.staffStatus === "rejected";
  const canUpload = !doc.hasFile || isRejected;
  const hasTemplate = ["ANTI_RAG_S","ANTI_RAG_P","ANTI_SUB"].includes(code);
  const doUpload = async (e) => { const f = e.target.files?.[0]; if (!f) return; setErr(""); setBusy(true); try { await API.upload(`/api/student/documents/${code}/upload`, f); await reload(); setTab("verify"); } catch (ex) { setErr(ex.message); } setBusy(false); };
  const markReady = async () => { if (needsInst && !institution.trim()) { setErr("Enter the issuing institution / board first."); return; } setErr(""); setBusy(true); try { await API.patch(`/api/student/documents/${code}`, { selfVerify: verify, status:"ready", institutionName: institution }); await reload(); close(); } catch (ex) { setErr(ex.message); } setBusy(false); };
  const reportIssue = async () => { setErr(""); setBusy(true); try { await API.patch(`/api/student/documents/${code}`, { selfVerify: verify, status:"issue", issueNote: issue, institutionName: institution }); await reload(); close(); } catch (ex) { setErr(ex.message); } setBusy(false); };
  const saveInstitution = async () => { if (institution === (doc.institutionName || "")) return; setBusy(true); try { await API.patch(`/api/student/documents/${code}`, { institutionName: institution }); await reload(); } catch (ex) { setErr(ex.message); } setBusy(false); };
  return (<div className="fixed inset-0 z-50 bg-black/40 grid place-items-center p-4">
    <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[92vh] overflow-hidden flex flex-col">
      <div className="p-5 border-b border-slate-200 flex items-start justify-between">
        <div><div className="text-xs text-slate-500">Mandatory Document</div><div className="font-semibold text-slate-800">{doc.name}<MandStar/></div><div className="text-xs text-slate-500 mt-1"><span className={`inline-block px-2 py-0.5 rounded ${doc.original?'bg-rose-50 text-rose-700':'bg-emerald-50 text-emerald-700'}`}>{doc.original?'Original required at campus':'Photocopy acceptable'}</span>{" · "}{cat.copies} copy/copies · {cat.formats}</div>{hasTemplate && <div className="mt-1 text-[11px]"><button onClick={openTemplates} className="text-indigo-600 hover:underline">📄 Download the standard template for this form</button></div>}</div>
        <button onClick={close} className="text-slate-400 hover:text-slate-700 text-2xl leading-none">×</button>
      </div>
      {doc.flagged && (<div className="mx-5 mt-3 text-sm bg-rose-50 border border-rose-200 text-rose-800 rounded-lg p-3"><b>⚑ Flagged — Verification Required.</b> The institution you entered ({doc.institutionName}) matches our list of non-recognised institutions: <b>{doc.flagMatch}</b>. The verification cell will review this manually.</div>)}
      {isRejected && doc.issueNote && (<div className="mx-5 mt-3 text-sm bg-rose-50 border border-rose-200 text-rose-800 rounded-lg p-3"><b>Rejected by verification staff:</b> {doc.issueNote} — please upload a corrected file.</div>)}
      {isVerified && (<div className="mx-5 mt-3 text-sm bg-green-50 border border-green-200 text-green-800 rounded-lg p-3">✓ This document has been verified by the verification cell{doc.verifiedByStaffId?<span> by <b>{doc.verifiedByStaffId}{doc.verifiedByName?` (${doc.verifiedByName})`:""}</b></span>:null}{doc.verifiedAt?<span> on <b>{fmtDate(doc.verifiedAt)}</b></span>:null}.</div>)}
      <div className="border-b border-slate-200 px-5"><div className="flex gap-4 text-sm">{[["upload","1 · Upload"],["sample","2 · Sample & Mistakes"],["verify","3 · Self-Verify"],["issue","4 · Report Issue"]].map(t=>(<button key={t[0]} onClick={()=>setTab(t[0])} className={`py-3 border-b-2 ${tab===t[0]?'border-indigo-600 text-indigo-700 font-semibold':'border-transparent text-slate-500'}`}>{t[1]}</button>))}</div></div>
      <div className="p-5 overflow-y-auto">
        {tab==="upload" && (<div>
          <div className="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center bg-slate-50">
            <div className="text-3xl">⤴</div><div className="font-semibold mt-2 text-slate-700">Upload scanned copy</div><div className="text-xs text-slate-500">Accepted: {cat.formats}</div>
            {canUpload ? (<label className={`mt-3 inline-block px-4 py-2 rounded-lg cursor-pointer ${busy?'bg-slate-300 text-slate-500':'bg-indigo-600 text-white hover:bg-indigo-700'}`}>{busy?"Uploading…":(doc.hasFile?"Replace file":"Choose file")}<input type="file" className="hidden" accept=".pdf,.jpg,.jpeg,.png" disabled={busy} onChange={doUpload} /></label>) : (<div className="mt-3 inline-block bg-slate-200 text-slate-600 px-4 py-2 rounded-lg text-sm">🔒 Locked — replacement allowed only after staff rejection</div>)}
            {doc.hasFile && (<div className="mt-3 text-sm text-slate-700 flex items-center justify-center gap-2 flex-wrap">Current file: <b>{doc.fileName}</b><button onClick={()=>setPreview(true)} className="text-xs px-2 py-1 rounded-md border border-indigo-300 text-indigo-700 hover:bg-indigo-50">👁 Preview my upload</button></div>)}
          </div>
          {code === "PHOTOS" && (<div className="mt-4 text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-lg p-3"><b>⚠ Photograph rules:</b> Plain <b>WHITE background only</b>. Other colours (blue, red, grey, gradient) will be rejected. Recent (under 6 months). No selfies, sunglasses or hats. Standard passport-size 3.5×4.5 cm.</div>)}
          <div className="mt-4 text-xs text-slate-600 bg-blue-50 border border-blue-200 rounded-lg p-3">Your file is sent over HTTPS and stored as a private, encrypted asset. Only you and the verification cell can open it.</div>
          <ErrorNote msg={err} />
        </div>)}
        {tab==="sample" && (<div><div className="bg-slate-100 rounded-xl p-4"><div className="text-xs text-slate-500">Sample preview (illustration)</div><SampleDoc title={doc.name} /></div><div className="mt-4"><div className="font-semibold text-slate-800 text-sm">Common mistakes to avoid</div><ul className="mt-2 text-sm text-slate-700 list-disc list-inside space-y-1">{cat.mistakes.map((m,i)=><li key={i}>{m}</li>)}</ul></div></div>)}
        {tab==="verify" && (<div>
          {needsInst && (<div className="mb-4"><label className="text-xs font-medium text-slate-600">Issuing institution / board <MandStar/></label><input value={institution} onChange={e=>setInstitution(e.target.value)} onBlur={saveInstitution} placeholder="e.g. Karnataka Secondary Education Examination Board" className="ev-input mt-1" /><div className="text-[11px] text-slate-500 mt-1">The system auto-checks this against a list of non-recognised institutions.</div></div>)}
          <div className="text-sm text-slate-700">Before you submit, please confirm each of these:</div>
          <div className="mt-3 space-y-2">{VERIFY_QUESTIONS.map(q=>(<label key={q.key} className="flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer"><input type="checkbox" disabled={isReady||isVerified} checked={!!verify[q.key]} onChange={e=>setVerify({...verify,[q.key]:e.target.checked})} className="mt-1 w-4 h-4 accent-indigo-600" /><span className="text-sm text-slate-700">{q.q}</span></label>))}</div>
          <ErrorNote msg={err} />
          <div className="mt-4 flex flex-wrap gap-2 items-center">
            {isVerified ? (<span className="text-sm font-semibold bg-green-100 text-green-700 px-3 py-1.5 rounded-md">✓ Verified by the verification cell</span>) : isReady ? (<span className="text-sm font-semibold bg-green-100 text-green-700 px-3 py-1.5 rounded-md">✓ Already marked Ready — awaiting staff verification</span>) : (<><button disabled={!doc.hasFile||!allVerified||busy||(needsInst&&!institution.trim())} onClick={markReady} className={`px-4 py-2 rounded-lg font-semibold ${(!doc.hasFile||!allVerified||busy||(needsInst&&!institution.trim()))?'bg-slate-200 text-slate-400 cursor-not-allowed':'bg-green-600 text-white hover:bg-green-700'}`}>{busy?"Saving…":"✓ Mark as Ready"}</button>{!doc.hasFile && <span className="text-xs text-slate-500">Upload the file first.</span>}{doc.hasFile && !allVerified && <span className="text-xs text-slate-500">Tick all six checks.</span>}{doc.hasFile && allVerified && needsInst && !institution.trim() && <span className="text-xs text-slate-500">Enter the issuing institution.</span>}</>)}
          </div>
        </div>)}
        {tab==="issue" && (<div><div className="text-sm text-slate-700">If the document is unavailable, damaged, pending or incorrect, describe the issue.</div><textarea value={issue} onChange={e=>setIssue(e.target.value)} rows="3" placeholder="e.g. My 12th original marks card has not been issued yet by the board." className="w-full mt-3 border border-slate-300 rounded-lg p-2 text-sm" /><ErrorNote msg={err} /><button disabled={busy||isVerified} onClick={reportIssue} className="mt-3 bg-rose-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-rose-700 disabled:opacity-60">{busy?"Saving…":"⚠ Report Issue & Pause"}</button>{isVerified && <div className="text-[11px] text-slate-500 mt-2">This document is already verified — you cannot report an issue.</div>}</div>)}
      </div>
    </div>

function SSlot({ data, reload, go }) {

  const byDate = {}; (slots||[]).forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });

    {!slotLocked && !slots && <Spinner label="Loading slots…" />}
    {!slotLocked && slots && (<div className="mt-5 space-y-4">
      <p className="text-sm text-slate-500">Pick a date and time to report on campus with your originals. <span className="text-amber-700">Note: dates are released in batches by the admissions office, so more may appear later.</span></p>

    </div>)}

/* ============================================================ ADMIN APP ============================================================ */
function pipelineStatus(r) {
  if (r.flagged > 0) return "Flagged";
  if (r.physicalReportingCompleted) return "Reported";
  if (r.cleared) return "Cleared";
  if (r.slotRejected) return "Slot Rejected";
  if (r.issues > 0) return "Needs Attention";
  if (r.ready === r.total && r.total > 0) return "Docs Ready";
  return "In Progress";
}
function statusPill(label) {
  const map = { "Flagged":"bg-rose-100 text-rose-800 border border-rose-300", "Slot Rejected":"bg-orange-100 text-orange-800 border border-orange-300", "Reported":"bg-indigo-100 text-indigo-700", "Cleared":"bg-green-100 text-green-700", "Needs Attention":"bg-amber-100 text-amber-800", "Docs Ready":"bg-emerald-100 text-emerald-700", "In Progress":"bg-slate-100 text-slate-600" };
  return map[label] || "bg-slate-100 text-slate-600";
}

function AdminApp({ auth, logout }) {
  const [stats, setStats] = useState(null);

  useEffect(() => { loadAll(); }, [loadAll]);
  const rows = (students || []).filter(r => {
    if (filters.department && r.department !== filters.department) return false;
    if (filters.section && r.section !== filters.section) return false;
    if (filters.batch && r.batch !== filters.batch) return false;
    if (filters.status && pipelineStatus(r) !== filters.status) return false;
    if (filters.q) { const q = filters.q.toLowerCase(); if (!(r.name.toLowerCase().includes(q) || r.appNo.toLowerCase().includes(q) || (r.program||"").toLowerCase().includes(q))) return false; }
    return true;

      <div className="mt-4 bg-white border border-slate-200 rounded-2xl overflow-hidden"><div className="px-5 py-3 border-b border-slate-200 flex items-center justify-between"><div className="font-semibold text-slate-800">Student Pipeline</div><div className="text-xs text-slate-500">{rows.length} of {students?students.length:0} shown</div></div><div className="overflow-x-auto"><table className="min-w-full text-sm"><thead className="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider"><tr><th className="text-left px-4 py-3">Application</th><th className="text-left px-4 py-3">Name</th><th className="text-left px-4 py-3">Program / Dept</th><th className="text-left px-4 py-3">Section</th><th className="text-left px-4 py-3">Uploaded</th><th className="text-left px-4 py-3">Verified</th><th className="text-left px-4 py-3">Status</th><th className="text-left px-4 py-3">Action</th></tr></thead><tbody>{!students && <tr><td colSpan="8" className="px-4 py-8 text-center text-slate-400">Loading…</td></tr>}{students && rows.length===0 && <tr><td colSpan="8" className="px-4 py-8 text-center text-slate-400">No students match these filters.</td></tr>}{rows.map(r=>{const label = pipelineStatus(r); return (<tr key={r.appNo} className={`border-t border-slate-100 hover:bg-slate-50 cursor-pointer ${r.flagged>0?'bg-rose-50/40':''}`} onClick={()=>setSelected(r.appNo)}><td className="px-4 py-3 font-mono text-xs">{r.appNo}</td><td className="px-4 py-3 font-medium text-slate-800">{r.flagged>0 && <span className="text-rose-600 mr-1">⚑</span>}{r.name}</td><td className="px-4 py-3 text-slate-600">{r.program}<div className="text-[11px] text-slate-400">{r.department||"—"}</div></td><td className="px-4 py-3 text-slate-600">{r.section||"—"}</td><td className="px-4 py-3 text-xs text-slate-600">{r.uploaded}/{r.total}</td><td className="px-4 py-3"><div className="flex items-center gap-2"><div className="w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full ${r.verified===   const remove = async (id, name) => { if (!window.confirm(`Remove "${name}"?`)) return; try { await API.del("/api/admin/blacklist/" + id); await load(); } catch (ex) { setErr(ex.message); } };
  const visible = (entries || []).filter(e => !q || e.name.toLowerCase().includes(q.toLowerCase()));
  return (<div className="fixed inset-0 z-50 bg-black/40 grid place-items-center p-4"><div className="bg-white rounded-2xl max-w-3xl w-full max-h-[92vh] overflow-hidden flex flex-col"><div className="p-5 border-b border-slate-200 flex items-start justify-between"><div><div className="text-xs text-slate-500">Fake / Non-recognised Institutions</div><div className="font-bold text-slate-800 text-lg">Non-recognised Universities & Boards</div></div><button onClick={close} className="text-slate-400 hover:text-slate-700 text-2xl leading-none">×</button></div><div className="p-5 overflow-y-auto"><div className="flex items-center justify-between flex-wrap gap-2 mb-2"><div className="font-semibold text-slate-800 text-sm">{entries?entries.length:"…"} entries</div><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search…" className="ev-input w-56" /></div><div className="border border-slate-200 rounded-lg divide-y max-h-72 overflow-auto">{!entries && <div className="p-3 text-sm text-slate-400">Loading…</div>}{entries && visible.map(e=>(<div key={e.id} className="p-3 flex items-start justify-between gap-2 text-sm"><div><div className="font-medium text-slate-800">{e.name}</div><div className="text-[11px] text-slate-500">{e.region||"—"}{e.reason ? " · "+e.reason : ""}</div></div>{isSupervisor && <button onClick={()=>remove(e.id, e.name)} className="text-xs text-rose-600 hover:underline">Remove</button>}</div>))}</div>{isSupervisor && (<form onSubmit={add} className="mt-5 border-t border-slate-200 pt-4"><div className="font-semibold text-slate-800 text-sm mb-2">Add an institution</div><div className="grid sm:grid-cols-3 gap-3"><div className="sm:col-span-2"><Field label="Institution name *"><input required value={f.name} onChange={e=>set("name",e.target.value)} className="ev-input" /></Field></div><Field label="Region / State"><input value={f.region} onChange={e=>set("region",e.target.value)} className="ev-input" /></Field><div className="sm:col-span-3"><Field label="Reason / note"><input value={f.reason} onChange={e=>set("reason",e.target.value)} className="ev-input" /></Field></div></div><ErrorNote msg={err} /><OkNote msg={ok} /><button disabled={busy} className="mt-3 text-sm bg-rose-600 text-white px-4 py-2 rounded-lg hover:bg-rose-700 disabled:opacity-60">{busy?"Adding…":"Add to Blacklist"}</button></form>)}</div><div className="p-4 border-t border-slate-200 flex justify-end"><button onClick={close} className="text-sm bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-900">Close</button></div></div></div>);
}

/* ============================================================
   v6 — COMPREHENSIVE SLOT MANAGEMENT MODAL
   ============================================================ */
const SLOT_STATUS_BADGE = {
  open:         { label:"Open",         cls:"bg-green-100 text-green-700 border border-green-300" },
  hidden:       { label:"Hidden",       cls:"bg-slate-100 text-slate-600 border border-slate-300" },
  closed:       { label:"Closed",       cls:"bg-amber-100 text-amber-800 border border-amber-300" },
  fully_booked: { label:"Fully Booked", cls:"bg-rose-100 text-rose-800 border border-rose-300" },
};

function StatusBadge({ status }) {
  const b = SLOT_STATUS_BADGE[status] || SLOT_STATUS_BADGE.open;
  return <span className={`text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded ${b.cls}`}>{b.label}</span>;
}

function SlotMgmtModal({ close, isSupervisor }) {
  const [slots, setSlots] = useState(null);
  const [stats, setStats] = useState(null);
  const [err, setErr] = useState(""); const [ok, setOk] = useState("");
  const [busy, setBusy] = useState(false);
  const [f, setF] = useState({ date:"", time:"", capacity:20, durationMinutes:30, status:"open" });
  const [tab, setTab] = useState("manage"); // manage | stats | add

  const load = useCallback(async () => {
    try {
      const [s, st] = await Promise.all([
        API.get("/api/admin/slots"),
        API.get("/api/admin/slots/stats"),
      ]);
      setSlots(s.slots); setStats(st); setErr("");
    } catch (ex) { setErr(ex.message); }
  }, []);
  useEffect(() => { load(); }, [load]);

  const set = (k,v) => setF(s=>({ ...s, [k]:v }));

  const add = async (e) => {
    e.preventDefault(); setErr(""); setOk(""); setBusy(true);
    try {
      await API.post("/api/admin/slots", f);
      setOk(`Slot ${f.date} ${f.time} added.`);
      setF({ date:"", time:"", capacity:20, durationMinutes:30, status:"open" });
      await load();
    } catch (ex) { setErr(ex.message); }
    setBusy(false);
  };
  const patchSlot = async (id, patch) => {
    setErr("");
    try { await API.patch("/api/admin/slots/" + id, patch); await load(); }
    catch (ex) { setErr(ex.message); }
  };
  const remove = async (id) => {
    if (!window.confirm("Delete this slot?")) return;
    setErr("");
    try { await API.del("/api/admin/slots/" + id); await load(); } catch (ex) { setErr(ex.message); }
  };
  const bulkStatus = async (target, opts) => {
    setErr("");
    try {
      const body = { status: target, ...opts };
      const r = await API.post("/api/admin/slots/bulk-status", body);
      setOk(`Updated ${r.changed} slot(s).`);
      await load();
    } catch (ex) { setErr(ex.message); }
  };

  const byDate = useMemo(() => {
    const m = {};
    (slots||[]).forEach(s => { const d = fmtDate(s.date); (m[d] = m[d] || []).push(s); });
    return m;
  }, [slots]);
  const dates = Object.keys(byDate).sort();
  const dateMeta = (date) => (stats?.byDate || []).find(d => fmtDate(d.date) === date) || null;

  return (<div className="fixed inset-0 z-50 bg-black/40 grid place-items-center p-4">
    <div className="bg-white rounded-2xl max-w-5xl w-full max-h-[94vh] overflow-hidden flex flex-col">
      <div className="p-5 border-b border-slate-200 flex items-start justify-between">
        <div>
          <div className="text-xs text-slate-500">Reporting Slots</div>
          <div className="font-bold text-slate-800 text-lg">Slot Management</div>
          <div className="text-xs text-slate-500 mt-1">Batch-wise release, dynamic capacity, and real-time occupancy. Changes take effect immediately.</div>
        </div>
        <button onClick={close} className="text-slate-400 hover:text-slate-700 text-2xl leading-none">×</button>
      </div>

      <div className="border-b border-slate-200 px-5"><div className="flex gap-4 text-sm">
        {[["manage","Manage Dates & Slots"],["stats","Statistics & Utilization"],["add","Add Slot"]].map(t => (
          <button key={t[0]} onClick={()=>setTab(t[0])} className={`py-3 border-b-2 ${tab===t[0]?'border-indigo-600 text-indigo-700 font-semibold':'border-transparent text-slate-500'}`}>{t[1]}</button>
        ))}
      </div></div>

      <div className="p-5 overflow-y-auto">
        <ErrorNote msg={err} /><OkNote msg={ok} />
        {!slots && <Spinner label="Loading slots…" />}

        {/* ---- STATISTICS TAB ---- */}
        {slots && tab === "stats" && (
          <div>
            {stats && (<>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <MiniStat big={String(stats.overall.totalSlots)} label="Total slots" tone="slate" />
                <MiniStat big={String(stats.overall.totalCapacity)} label="Total capacity" tone="indigo" />
                <MiniStat big={String(stats.overall.totalBooked)} label="Booked" tone="green" />
                <MiniStat big={stats.overall.utilizationPct + "%"} label="Overall utilization" tone={stats.overall.utilizationPct>80?"rose":"indigo"} />
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">
                <MiniStat big={String(stats.overall.slotsOpen)} label="Open" tone="green" small />
                <MiniStat big={String(stats.overall.slotsFull)} label="Fully Booked" tone="rose" small />
                <MiniStat big={String(stats.overall.slotsHidden)} label="Hidden" tone="slate" small />
                <MiniStat big={String(stats.overall.slotsClosed)} label="Closed" tone="slate" small />
              </div>

              <div className="font-semibold text-slate-800 text-sm mt-5 mb-2">Booking by Date</div>
              <div className="border border-slate-200 rounded-lg divide-y">
                {stats.byDate.length === 0 && <div className="p-3 text-sm text-slate-400">No slots created yet.</div>}
                {stats.byDate.map(d => (
                  <div key={d.date} className="p-3 text-sm">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                      <div className="font-medium text-slate-800">{fmtDate(d.date)}</div>
                      <div className="text-xs text-slate-600">{d.booked}/{d.capacity} ({d.utilizationPct}%) · {d.slots} slot(s) · open {d.open}, hidden {d.hidden}, closed {d.closed}</div>
                    </div>
                    <div className="w-full h-2 mt-2 bg-slate-100 rounded-full overflow-hidden">
                      <div className={`h-full ${d.utilizationPct>80?'bg-rose-500':d.utilizationPct>50?'bg-amber-500':'bg-emerald-500'}`} style={{width: d.utilizationPct + "%"}}></div>
                    </div>
                  </div>
                ))}
              </div>
            </>)}
          </div>
        )}

        {/* ---- MANAGE TAB ---- */}
        {slots && tab === "manage" && (
          <div>
            {isSupervisor && (
              <div className="bg-indigo-50 border border-indigo-200 rounded-lg p-3 mb-4 text-sm">
                <div className="font-semibold text-indigo-900">Bulk release / hide / close</div>
                <div className="text-xs text-indigo-800 mt-1">Apply the same status to one or more whole dates at once. Useful for batch-wise date release ("open the first two days first, then the next two").</div>
                <BulkDateReleaser dates={dates} onApply={(targetDates, status) => bulkStatus(status, { dates: targetDates })} />
              </div>
            )}

            {dates.length === 0 && <div className="text-sm text-slate-500">No slots yet. Use "Add Slot" to create one.</div>}
            {dates.map(date => {
              const dayMeta = dateMeta(date);
              const items = byDate[date];
              const slotIdsToday = items.map(s => s.id);
              const allOpen   = items.every(s => s.status === "open");
              const allHidden = items.every(s => s.status === "hidden");
              const allClosed = items.every(s => s.status === "closed");
              return (<div key={date} className="border border-slate-200 rounded-lg p-3 mb-3">
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <div className="font-semibold text-slate-800">{date}
                    <span className="text-xs text-slate-400 ml-2">{items.length} slot(s)</span>
                    {dayMeta && <span className="text-xs text-slate-600 ml-2">· {dayMeta.booked}/{dayMeta.capacity} booked ({dayMeta.utilizationPct}%)</span>}
                  </div>
                  {isSupervisor && (
                    <div className="flex flex-wrap gap-2 text-xs">
                      <button onClick={()=>bulkStatus("open", { ids: slotIdsToday })}    className={`px-2 py-1 rounded border ${allOpen?'border-green-300 bg-green-50 text-green-800':'border-green-300 text-green-700 hover:bg-green-50'}`}>Release day (Open)</button>
                      <button onClick={()=>bulkStatus("hidden", { ids: slotIdsToday })}  className={`px-2 py-1 rounded border ${allHidden?'border-slate-300 bg-slate-50 text-slate-700':'border-slate-300 text-slate-700 hover:bg-slate-50'}`}>Hide day</button>
                      <button onClick={()=>bulkStatus("closed", { ids: slotIdsToday })}  className={`px-2 py-1 rounded border ${allClosed?'border-amber-300 bg-amber-50 text-amber-800':'border-amber-300 text-amber-700 hover:bg-amber-50'}`}>Close day</button>
                    </div>
                  )}
                </div>
                {dayMeta && (
                  <div className="w-full h-1.5 mt-2 bg-slate-100 rounded-full overflow-hidden">
                    <div className={`h-full ${dayMeta.utilizationPct>80?'bg-rose-500':dayMeta.utilizationPct>50?'bg-amber-500':'bg-emerald-500'}`} style={{width: dayMeta.utilizationPct + "%"}}></div>
                  </div>
                )}
                <div className="mt-2 divide-y">
                  {items.map(s => {
                    const occPct = s.capacity ? Math.round((s.booked/s.capacity)*100) : 0;
                    return (<div key={s.id} className="py-2 flex items-center justify-between flex-wrap gap-2 text-sm">
                      <div className="min-w-[160px]">
                        <div className="font-medium">{s.time} <span className="text-[11px] text-slate-500">({s.durationMinutes} min)</span></div>
                        <div className="text-[11px] text-slate-500">{s.booked}/{s.capacity} booked · {s.seatsLeft} seats left</div>
                        <div className="w-32 h-1 mt-1 bg-slate-100 rounded overflow-hidden"><div className={`h-full ${occPct>=100?'bg-rose-500':occPct>80?'bg-amber-500':'bg-emerald-500'}`} style={{width: Math.min(occPct,100) + "%"}}></div></div>
                      </div>
                      <div className="flex items-center gap-2 flex-wrap">
                        <StatusBadge status={s.displayStatus} />
                        {isSupervisor ? (<>
                          <label className="text-xs flex items-center gap-1">status
                            <select value={s.status} onChange={e=>patchSlot(s.id, { status: e.target.value })} className="ev-input py-1 w-auto">
                              <option value="open">Open</option>
                              <option value="hidden">Hidden</option>
                              <option value="closed">Closed</option>
                            </select>
                          </label>
                          <label className="text-xs flex items-center gap-1">cap
                            <input type="number" min="1" defaultValue={s.capacity}
                              onBlur={e=>{ if (Number(e.target.value)!==s.capacity) patchSlot(s.id, { capacity: e.target.value }); }}
                              className="ev-input w-16 py-1" />
                          </label>
                          <label className="text-xs flex items-center gap-1">dur
                            <input type="number" min="5" max="480" defaultValue={s.durationMinutes}
                              onBlur={e=>{ if (Number(e.target.value)!==s.durationMinutes) patchSlot(s.id, { durationMinutes: e.target.value }); }}
                              className="ev-input w-16 py-1" />
                          </label>
                          <button disabled={s.booked>0} onClick={()=>remove(s.id)}
                            className={`text-xs px-2 py-1 rounded ${s.booked>0?'border border-slate-200 text-slate-300 cursor-not-allowed':'border border-rose-300 text-rose-600 hover:bg-rose-50'}`}>Delete</button>
                        </>) : null}
                      </div>
                    </div>);
                  })}
                </div>
              </div>);
            })}
          </div>
        )}

        {/* ---- ADD TAB ---- */}
        {slots && tab === "add" && (
          isSupervisor ? (
            <form onSubmit={add}>
              <div className="font-semibold text-slate-800 text-sm mb-2">Add a new slot</div>
              <div className="grid sm:grid-cols-5 gap-3 items-end">
                <Field label="Date *"><input required type="date" value={f.date} onChange={e=>set("date",e.target.value)} className="ev-input" /></Field>
                <Field label="Time *"><input required value={f.time} onChange={e=>set("time",e.target.value)} className="ev-input" placeholder="e.g. 09:30 AM" /></Field>
                <Field label="Capacity *"><input required type="number" min="1" max="1000" value={f.capacity} onChange={e=>set("capacity",e.target.value)} className="ev-input" /></Field>
                <Field label="Duration (min)"><input required type="number" min="5" max="480" value={f.durationMinutes} onChange={e=>set("durationMinutes",e.target.value)} className="ev-input" /></Field>
                <Field label="Initial status">
                  <select value={f.status} onChange={e=>set("status",e.target.value)} className="ev-input">
                    <option value="open">Open (immediately visible)</option>
                    <option value="hidden">Hidden (release later)</option>
                    <option value="closed">Closed</option>
                  </select>
                </Field>
              </div>
              <button disabled={busy} className="mt-3 text-sm bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 disabled:opacity-60">{busy?"Adding…":"Add Slot"}</button>
              <div className="text-[11px] text-slate-500 mt-2">Times look like <code>09:00 AM</code> or <code>14:00</code>. Slots on the same date must be ≥ 30 minutes apart. New slots default to <b>Open</b>; pick <b>Hidden</b> to release later.</div>
            </form>
          ) : <div className="text-sm text-slate-500">Only Supervisor accounts can create slots.</div>
        )}
      </div>
      <div className="p-4 border-t border-slate-200 flex justify-end"><button onClick={close} className="text-sm bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-900">Close</button></div>
    </div>
  </div>);
}

/** Bulk-select dates and apply a status to all slots on those dates. */
function BulkDateReleaser({ dates, onApply }) {
  const [picked, setPicked] = useState({});
  const [status, setStatus] = useState("open");
  const toggle = (d) => setPicked(p => ({ ...p, [d]: !p[d] }));
  const selected = Object.keys(picked).filter(d => picked[d]);
  const apply = () => { if (!selected.length) return; onApply(selected, status); setPicked({}); };
  return (<div className="mt-2">
    <div className="flex flex-wrap gap-1">
      {dates.length === 0 && <div className="text-xs text-indigo-700">Add a slot first to enable bulk release.</div>}
      {dates.map(d => (
        <button key={d} onClick={()=>toggle(d)} className={`text-xs px-2 py-1 rounded ${picked[d]?'bg-indigo-600 text-white':'bg-white border border-indigo-300 text-indigo-700 hover:bg-indigo-50'}`}>{d}</button>
      ))}
    </div>
    {dates.length > 0 && (
      <div className="mt-2 flex items-center gap-2 flex-wrap">
        <span className="text-xs text-indigo-800">{selected.length} date(s) selected →</span>
        <select value={status} onChange={e=>setStatus(e.target.value)} className="ev-input py-1 w-auto"><option value="open">Open (release)</option><option value="hidden">Hidden</option><option value="closed">Closed</option></select>
        <button disabled={!selected.length} onClick={apply} className={`text-xs px-3 py-1 rounded ${selected.length?'bg-indigo-600 text-white hover:bg-indigo-700':'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>Apply</button>
      </div>
    )}
  </div>);
}

/* ============================================================ */
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
